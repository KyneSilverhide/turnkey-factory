modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Deux blocs pour automatiser le chantier : le Controleur d'usine batit une usine prefabriquee (murs, fenetres, toit, deco) autour de lui selon les dimensions et le style choisis, en puisant les ressources dans un inventaire lie ; la Niveleuse aplanit et comble un terrain a la volee avec une pelle et le meme reseau d'inventaires. Integration optionnelle avec Create.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[0.5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="createdeco"
    type="optional"
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"
